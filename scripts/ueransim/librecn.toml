# LibreCN with an AMF on 127.0.0.1:38412, PLMN 999/70, SST 1 (the defaults),
# an AUSF and a UDM knowing UERANSIM's sample UE (ue.yaml), an SMF and a UPF
# (DNNs internet, 10.45.0.0/16, and ims, 10.46.0.0/16; N3 on 127.0.0.2), for the scripts of
# scripts/ueransim/.
[[runtime.pools]]
name = "cp"
workers = 1

[oam]
listen = "127.0.0.1:0"

[[nf]]
kind = "amf"
name = "amf-1"
[nf.params]
network_name = { full = "LibreCN test network", short = "LibreCN" }

[[nf]]
kind = "ausf"
name = "ausf"

[[nf]]
kind = "udm"
name = "udm"
[[nf.params.subscribers]]
supi = "imsi-999700000000001"
k = "465B5CE8B199B49FAA5F0A2EE238A6BC"
opc = "E8ED289DEBA952E4283B54E88E6183CA"
auth = "eap-aka-prime"  # the Docker and scale checks keep 5G AKA
[[nf.params.home_network_keys]]  # SUCI Profile A: TS 33.501 Annex C.4.3's key, the UE's public key
id = 1
private_key = "c53c22208b61860b06c62e5406a7b330c2b577aa5558981510d128247d38bd1d"

[[nf]]
kind = "smf"
name = "smf"
[nf.params]
dnns = [{ dnn = "internet", pool = "10.45.0.0/16" }, { dnn = "ims", pool = "10.46.0.0/16" }]

[[nf]]
kind = "upf"
name = "upf"
