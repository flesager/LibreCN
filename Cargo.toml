[workspace]
resolver = "3"
members = [
    "scheduler",
    "common",
    "oam",
    "app",
    "proto/ngap",
    "proto/nas",
    "proto/security",
    "proto/sbi",
    "nf/amf",
    "nf/smf",
    "nf/ausf",
    "nf/udm",
    "nf/upf",
]
exclude = ["proto/ngap/codegen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
zerocopy = { version = "0.8", features = ["derive"] }
rustix = { version = "1", features = ["event", "thread", "rand"] }
proptest = "1"
loom = "0.7"
criterion = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
httparse = "1"
rasn = "0.29"
libc = "0.2"
signal-hook = "0.3"
aes = "0.8"
cmac = "0.7"
ctr = "0.9"
hmac = "0.12"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
panic = "abort"
debug = "line-tables-only"

# rasn with the APER fixes found by proto/ngap (see proto/ngap/README.md).
[patch.crates-io]
rasn = { git = "https://github.com/flesager/rasn", rev = "c763fedbd0eee325812bef0e59d86b2f16b78be5" }
