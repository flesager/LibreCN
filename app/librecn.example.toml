# LibreCN configuration example: `librecn --config librecn.example.toml`.
# Every section is optional; without a file: pool "cp" with one worker per
# core but one, pool "oam" with one worker, web server on 127.0.0.1:8080.

[runtime]
max_eos = 256
fault_policy = "abort"        # "isolate": a panicking EO is faulted, the others run on

[[runtime.pools]]             # control-plane NFs
name = "cp"
workers = 2                   # or `cores = [2, 3]` for pinned workers

[[runtime.pools]]             # OAM EOs: log, alarm, control, server
name = "oam"
workers = 1

[oam]
listen = "127.0.0.1:8080"     # web API and GUI
log_level = "info"            # vip, fatal, error, info, debug: every EO's threshold
# state_dir = "/var/lib/librecn"  # optional: what the NFs keep across restarts (web API changes, SQNs)

# NFs started at boot; more through the GUI or `POST /api/nfs`.
[[nf]]
kind = "udm"
name = "udm"
pool = "cp"
[[nf.params.subscribers]]     # UERANSIM's sample UE
supi = "imsi-999700000000001"
k = "465B5CE8B199B49FAA5F0A2EE238A6BC"
opc = "E8ED289DEBA952E4283B54E88E6183CA"
amf = "8000"                  # optional: the default
sqn = "000000000000"          # optional: the last SQN used
auth = "5g-aka"               # optional: or "eap-aka-prime"
[[nf.params.home_network_keys]]  # optional: SUCI Profile A (ECIES); its public key is logged at start
id = 1                        # the key identifier the USIM puts in its SUCI
private_key = "c53c22208b61860b06c62e5406a7b330c2b577aa5558981510d128247d38bd1d"  # TS 33.501 Annex C.4.3: a test key only

[[nf]]
kind = "ausf"
name = "ausf"
pool = "cp"
[nf.params]                   # all optional: these are the defaults
udm = "udm"
max_contexts = 1024

[[nf]]
kind = "upf"
name = "upf"
pool = "cp"
[nf.params]                   # all optional: these are the defaults
n3 = "127.0.0.2"              # GTP-U address for the gNBs (not UERANSIM's 127.0.0.1)
# n6 = "upf0"                 # TUN device: forwarding on (see docker/core.sh)
mode = "event"                # or "poll", "hybrid": see nf/upf/README.md
max_sessions = 1024
fast_path = true              # the kernel carries the uplink (XDP), if it allows it: see nf/upf/README.md

[[nf]]
kind = "pcf"
name = "pcf"
pool = "cp"
# Policies per subscriber; what an entry leaves out comes from `default`, then
# from the built-in values (5QI 9, ARP 8, 1000 Mbit/s each way). The web API
# changes them (/api/nfs/pcf/policies), kept in [oam] state_dir if set.
[nf.params.default]           # optional: subscribers without their own entry
ue_ambr_mbps = { uplink = 1000, downlink = 1000 }
[[nf.params.default.sessions]]  # by DNN; no `dnn`: any DNN
five_qi = 9
arp = 8
ambr_mbps = { uplink = 1000, downlink = 1000 }
[[nf.params.policies]]        # optional
supi = "imsi-999700000000001"
count = 1                     # optional: this many SUPIs from this one on
ue_ambr_mbps = { uplink = 100, downlink = 500 }
[[nf.params.policies.sessions]]
dnn = "internet"
ambr_mbps = { uplink = 50, downlink = 200 }
[[nf.params.policies.sessions.flows]]   # PCC rules: extra QoS flows, 4 at most
five_qi = 1                   # GBR: `gbr_mbps` required
arp = 2
precedence = 10               # lowest first
mbr_mbps = { uplink = 1, downlink = 1 }
gbr_mbps = { uplink = 1, downlink = 1 }
filters = [{ direction = "both", remote = "10.10.0.0/16", protocol = 17, remote_ports = "5060-5061" }]

[[nf]]
kind = "smf"
name = "smf"
pool = "cp"
[nf.params]                   # all optional: these are the defaults
upf = "upf"
pcf = "pcf"                   # each session's QoS and AMBR
# Data networks, the first by default, each with its UE addresses (the first
# address is the UPF's N6 side: 10.45.0.1); pools must not overlap.
dnns = [{ dnn = "internet", pool = "10.45.0.0/16" }]
slices = [{ sst = 1 }]

[[nf]]
kind = "amf"
name = "amf-1"
pool = "cp"
[nf.params]                   # all optional: these are the defaults
n2 = "127.0.0.1:38412"
plmn = { mcc = "999", mnc = "70" }
amf_region = 1
amf_set = 1
amf_pointer = 0
relative_capacity = 255
slices = [{ sst = 1 }]
max_ues = 1024
ausf = "ausf"
smf = "smf"
pcf = "pcf"                   # each UE's UE-AMBR
ciphering = ["NEA2", "NEA0"]
t3512_s = 3240                # periodic registration timer (54 min, sent as 1 h)
# network_name = { full = "LibreCN", short = "LibreCN" }   # optional: sent to each UE once registered

[[nf]]
kind = "demo"
name = "demo-1"
pool = "cp"
[nf.params]
period_ms = 1000
alarm = false
