# LibreCN in its container (10.210.0.10): every NF, N2 and N3 on the
# container's address, N6 on upf0 (core.sh), UERANSIM's sample UE.
[[runtime.pools]]
name = "cp"
workers = 1

[[runtime.pools]]
name = "up"
workers = 1

[oam]
listen = "0.0.0.0:8080"

[[nf]]
kind = "udm"
name = "udm"
[[nf.params.subscribers]]
supi = "imsi-999700000000001"
k = "465B5CE8B199B49FAA5F0A2EE238A6BC"
opc = "E8ED289DEBA952E4283B54E88E6183CA"

[[nf]]
kind = "ausf"
name = "ausf"

[[nf]]
kind = "upf"
name = "upf"
pool = "up"
[nf.params]
n3 = "10.210.0.10"
n6 = "upf0"

[[nf]]
kind = "pcf"
name = "pcf"
[[nf.params.policies]]
supi = "imsi-999700000000001"
[[nf.params.policies.sessions]]
dnn = "internet"
ambr_mbps = { uplink = 10, downlink = 20 }   # user-plane.sh measures it with iperf3
[[nf.params.policies.sessions.flows]]  # user-plane.sh: the pings' answers on their own QoS flow
five_qi = 7
filters = [{ direction = "downlink", remote = "10.45.0.1", protocol = 1 }]

[[nf.params.policies.sessions]]
dnn = "ims"                   # the UPF's fast path carries it both ways
ambr_mbps = { uplink = 10, downlink = 20 }   # user-plane.sh measures it, policed in the kernel
[[nf.params.policies.sessions.flows]]  # and this flow's MBR, classified and policed in the kernel
five_qi = 6
mbr_mbps = { uplink = 5, downlink = 5 }
filters = [{ direction = "downlink", remote = "10.210.0.30", protocol = 17, remote_ports = "5203" }]

[[nf]]
kind = "smf"
name = "smf"
[nf.params]
dnns = [{ dnn = "internet", pool = "10.45.0.0/16" }, { dnn = "ims", pool = "10.46.0.0/16" }]

[[nf]]
kind = "amf"
name = "amf-1"
[nf.params]
n2 = "10.210.0.10:38412"
t3512_s = 30                  # short: user-plane.sh waits for a periodic registration
